
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0f172a" />
    <title>MIROMA - AI Assistant</title>
    <link rel="icon" type="image/x-icon" href="miroma.ico" />
    <link rel="apple-touch-icon" href="miroma.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <link rel="manifest" href="manifest.json" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        overflow: hidden;
      }
      .gemini-gradient-text {
        background: linear-gradient(74deg, #4285F4 0%, #9B72CB 50%, #D96570 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .leaflet-container { background: #0f172a !important; width: 100%; height: 100%; }
      .custom-popup .leaflet-popup-content-wrapper {
        background: rgba(15, 23, 42, 0.95) !important;
        backdrop-filter: blur(12px);
        color: white !important;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1.5rem !important;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",

  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx?v=1.0.9"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js').then(reg => {
            console.log('SW registrado');
          }).catch(err => {
            console.log('SW falhou', err);
          });
        });
      }
